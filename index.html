<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>چرخ سال — برنامه‌ریز اهداف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#11172c; --bg2:#0c1120; --panel:#1a2340; --panel2:#212c4d; --line:#2c3860;
    --gold:#e3a542; --spring:#7fb069; --summer:#e3a542; --autumn:#c1502e; --winter:#5f87b8;
    --text:#f3efe4; --muted:#93a0c2; --muted2:#5f6c92;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at 50% -10%, #1a2650 0%, var(--bg) 45%, var(--bg2) 100%);
    color:var(--text); font-family:'Vazirmatn',sans-serif; min-height:100vh; padding:28px 16px 90px;
  }
  .wrap{max-width:880px;margin:0 auto;}
  .brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:10px;}
  .brand h1{font-size:22px;font-weight:800;margin:0;letter-spacing:.5px;display:flex;align-items:center;gap:10px;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold);}
  .brand .today{font-size:12px;color:var(--muted);}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:12px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;}
  .btn:hover{border-color:var(--gold);}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .btn.primary{background:linear-gradient(135deg,var(--gold),#c78327);color:#1a1206;border:none;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;border:1px solid var(--line);}
  .btn.small{padding:6px 12px;font-size:12.5px;border-radius:9px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px;}
  .muted{color:var(--muted);font-size:13.5px;line-height:2;}
  .hint{color:var(--muted2);font-size:12px;}
  input[type=text],input[type=number],textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--text);padding:11px 13px;border-radius:10px;font-family:inherit;font-size:14px;margin-top:6px;}
  input:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold);}
  textarea{resize:vertical;min-height:70px;}
  label{font-size:13.5px;color:var(--muted);font-weight:600;}
  .field{margin-bottom:16px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .goal-chip{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .goal-chip .x{cursor:pointer;color:var(--muted2);font-size:18px;line-height:1;}
  .goal-chip .x:hover{color:var(--autumn);}
  .status-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;}
  .status-realistic{background:#7fb06933;color:#a8d68a;}
  .status-risky{background:#e3a54233;color:#f0c479;}
  .status-unrealistic{background:#c1502e33;color:#e79378;}
  .empty{text-align:center;padding:50px 20px;}
  .empty .icon{font-size:38px;margin-bottom:14px;opacity:.8;}
  h2{font-size:18px;font-weight:800;margin:0 0 6px;}
  h3{font-size:15px;font-weight:700;margin:0 0 10px;}
  .crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:18px;flex-wrap:wrap;}
  .crumbs a{color:var(--muted);cursor:pointer;text-decoration:none;}
  .crumbs a:hover{color:var(--gold);}
  .crumbs .sep{opacity:.4;}
  .wheel-box{display:flex;justify-content:center;margin:6px 0 22px;}
  .season-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
  @media(max-width:520px){.season-grid{grid-template-columns:1fr;}}
  .season-card{border-radius:16px;padding:16px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);transition:.15s;position:relative;overflow:hidden;}
  .season-card:hover{transform:translateY(-2px);border-color:var(--sc);}
  .season-card .bar{position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--sc);}
  .season-card .name{font-weight:800;font-size:16px;margin-bottom:4px;}
  .season-card .months{font-size:12px;color:var(--muted);}
  .month-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
  @media(max-width:520px){.month-grid{grid-template-columns:1fr;}}
  .month-card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.15s;}
  .month-card:hover{border-color:var(--gold);}
  .month-card .mname{font-weight:700;font-size:14.5px;margin-bottom:4px;}
  .week-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:14px;}
  .week-card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:center;transition:.15s;}
  .week-card:hover{border-color:var(--gold);}
  .item-row{display:flex;align-items:flex-start;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);}
  .item-row:last-child{border-bottom:none;}
  .item-row input[type=checkbox]{margin-top:3px;width:17px;height:17px;accent-color:var(--gold);cursor:pointer;flex-shrink:0;}
  .item-row .t{font-size:14px;line-height:1.6;}
  .item-row.done .t{text-decoration:line-through;color:var(--muted2);}
  .goal-block{margin-bottom:20px;}
  .goal-block .gtitle{font-size:13px;font-weight:700;color:var(--gold);margin-bottom:6px;}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-left:8px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-line{color:var(--muted);font-size:13.5px;display:flex;align-items:center;padding:20px 0;}
  .update-box{border-top:1px dashed var(--line);margin-top:18px;padding-top:16px;}
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);padding:10px 20px;border-radius:12px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:80;}
  .stepper{font-size:12px;color:var(--muted);margin-bottom:10px;}
  .score-badge{display:inline-block;background:color-mix(in srgb, var(--sc) 22%, transparent);color:var(--sc);border:1px solid var(--sc);font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;margin-inline-end:6px;}
  .eisen-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  @media(max-width:480px){.eisen-grid{grid-template-columns:1fr;}}
  .eisen-cell{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;border-top:4px solid var(--qc);}
  .eisen-cell .qh{font-size:12.5px;font-weight:800;color:var(--qc);margin-bottom:1px;}
  .eisen-cell .qs{font-size:10.5px;color:var(--muted2);margin-bottom:8px;}
  .eisen-cell .item-row{padding:6px 2px;}
  select{background:var(--bg2);border:1px solid var(--line);color:var(--text);padding:10px 10px;border-radius:10px;font-family:inherit;font-size:13.5px;}
  .del-x{color:var(--muted2);cursor:pointer;font-size:15px;margin-inline-start:6px;}
  .del-x:hover{color:var(--autumn);}
  .is-past{opacity:.4;}
  .is-today{box-shadow:0 0 0 2px var(--gold) inset;}
  .today-tag{display:inline-block;background:var(--gold);color:#1a1206;font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;margin-inline-start:6px;}
  .day-tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0 4px;padding-bottom:6px;}
  .day-tab{flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);font-size:12.5px;cursor:pointer;color:var(--muted);white-space:nowrap;}
  .day-tab.active{background:var(--gold);color:#1a1206;border-color:var(--gold);font-weight:700;}
  .day-tab.is-past{opacity:.45;}
  .quick-add{width:100%;background:transparent;border:1px dashed var(--line);color:var(--muted);padding:7px 10px;border-radius:9px;font-family:inherit;font-size:12.5px;margin-top:8px;}
  .quick-add:focus{border-style:solid;border-color:var(--gold);color:var(--text);}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom);}
  .nav-item{flex:1;text-align:center;padding:9px 2px 8px;cursor:pointer;color:var(--muted2);font-size:10.5px;}
  .nav-item .ic{font-size:19px;display:block;margin-bottom:2px;}
  .nav-item.active{color:var(--gold);}
  .icon-btn{background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:2px 6px;}
  .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;}
  .drawer-panel{position:fixed;top:0;right:0;bottom:0;width:80%;max-width:300px;background:var(--panel);border-inline-start:1px solid var(--line);z-index:71;padding:20px;overflow-y:auto;}
  .drawer-item{padding:14px 8px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;}
  .drawer-item:hover{color:var(--gold);}
  .chat-log{display:flex;flex-direction:column;gap:10px;margin:14px 0;max-height:440px;overflow-y:auto;}
  .chat-bubble{padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.7;max-width:88%;}
  .chat-bubble.ai{background:var(--panel2);border:1px solid var(--line);align-self:flex-start;}
  .chat-bubble.user{background:var(--gold);color:#1a1206;align-self:flex-end;font-weight:600;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ---------------- Gregorian <-> Jalali conversion (used only for display) ---------------- */
function jdiv(a,b){return ~~(a/b);}
function jmod(a,b){return a-~~(a/b)*b;}
function jalCal(jy){
  var breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  var bl=breaks.length, gy=jy+621, leapJ=-14, jp=breaks[0], jm,jump,leap,n,i;
  for(i=1;i<bl;i++){ jm=breaks[i]; jump=jm-jp; if(jy<jm) break;
    leapJ=leapJ+jdiv(jump,33)*8+jdiv(jmod(jump,33),4); jp=jm; }
  n=jy-jp;
  leapJ=leapJ+jdiv(n,33)*8+jdiv(jmod(n,33)+3,4);
  if(jmod(jump,33)===4 && jump-n===4) leapJ+=1;
  var leapG=jdiv(gy,4)-jdiv((jdiv(gy,100)+1)*3,4)-150;
  var march=20+leapJ-leapG;
  if(jump-n<6) n=n-jump+jdiv(jump,33)*33;
  leap=jmod(jmod(n+1,33)-1,4);
  if(leap===-1) leap=4;
  return {leap:leap,gy:gy,march:march};
}
function g2d(gy,gm,gd){
  var d=jdiv((gy+jdiv(gm-8,6)+100100)*1461,4)+jdiv(153*jmod(gm+9,12)+2,5)+gd-34840408;
  d=d-jdiv(jdiv(gy+100100+jdiv(gm-8,6),100)*3,4)+752;
  return d;
}
function d2g(jdn){
  var j=4*jdn+139361631;
  j=j+jdiv(jdiv(4*jdn+183187720,146097)*3,4)*4-3908;
  var i=jdiv(jmod(j,1461),4)*5+308;
  var gd=jdiv(jmod(i,153),5)+1;
  var gm=jmod(jdiv(i,153),12)+1;
  var gy=jdiv(j,1461)-100100+jdiv(8-gm,6);
  return {gy:gy,gm:gm,gd:gd};
}
function j2d(jy,jm,jd){ var r=jalCal(jy); return g2d(r.gy,3,r.march)+(jm-1)*31-jdiv(jm,7)*(jm-7)+jd-1; }
function d2j(jdn){
  var gy=d2g(jdn).gy, jy=gy-621, r=jalCal(jy), jdn1f=g2d(gy,3,r.march);
  var jd,jm,k=jdn-jdn1f;
  if(k>=0){ if(k<=185){ jm=1+jdiv(k,31); jd=jmod(k,31)+1; return {jy:jy,jm:jm,jd:jd}; } else k-=186; }
  else { jy-=1; k+=179; if(r.leap===1) k+=1; }
  jm=7+jdiv(k,30); jd=jmod(k,30)+1;
  return {jy:jy,jm:jm,jd:jd};
}
function toJalaali(gy,gm,gd){ return d2j(g2d(gy,gm,gd)); }

const MONTH_NAMES=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const WEEKDAY_BY_JSDOW=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];

const today=new Date();
const jToday=toJalaali(today.getFullYear(),today.getMonth()+1,today.getDate());

/* ---------------- Rolling 365-day plan architecture ----------------
   The plan is NOT tied to real calendar seasons/months. Day 0 = the day
   the person started planning. "quarter" / "month" / "week" below are
   just structural chunks of that rolling count (فصل ۱..۴, ماه ۱..۱۲).
   Past/current/future is computed by US in JS (never asked of the AI),
   which is what makes it reliable. */
const MONTH_LENS=[30,30,30,30,30,30,30,30,30,30,30,35]; // 11×30 + 35 = 365
function monthStartOffset(monthAbs){ let s=0; for(let i=0;i<monthAbs;i++) s+=MONTH_LENS[i]; return s; }
function monthLen(monthAbs){ return MONTH_LENS[monthAbs]; }
function dayIndexOf(si,mi,wi,di){ return monthStartOffset(si*3+mi)+wi*7+di; }
function coordsForDayIndex(idx){
  let monthAbs=0, offset=idx;
  while(offset>=MONTH_LENS[monthAbs]){ offset-=MONTH_LENS[monthAbs]; monthAbs++; if(monthAbs>=12) return null; }
  return { si:Math.floor(monthAbs/3), mi:monthAbs%3, wi:Math.floor(offset/7), di:offset%7 };
}
function daysSinceStart(){
  if(!state.startDate) return 0;
  const startJdn=g2d(state.startDate.gy,state.startDate.gm,state.startDate.gd);
  const nowJdn=g2d(today.getFullYear(),today.getMonth()+1,today.getDate());
  return nowJdn-startJdn;
}
function gregorianForDayIndex(idx){
  const startJdn=g2d(state.startDate.gy,state.startDate.gm,state.startDate.gd);
  return d2g(startJdn+idx);
}
function jalaliForDayIndex(idx){
  const g=gregorianForDayIndex(idx);
  return toJalaali(g.gy,g.gm,g.gd);
}
function weekdayNameForDayIndex(idx){
  const g=gregorianForDayIndex(idx);
  const jsDate=new Date(g.gy,g.gm-1,g.gd);
  return WEEKDAY_BY_JSDOW[jsDate.getDay()];
}
function isDayPast(si,mi,wi,di){ return dayIndexOf(si,mi,wi,di)<daysSinceStart(); }
function isDayToday(si,mi,wi,di){ return dayIndexOf(si,mi,wi,di)===daysSinceStart(); }
function monthRange(si,mi){ const s=monthStartOffset(si*3+mi); return {start:s,end:s+monthLen(si*3+mi)-1}; }
function quarterRange(si){ const s=monthStartOffset(si*3); return {start:s,end:monthStartOffset(si*3+3)-1}; }
function isMonthPast(si,mi){ return monthRange(si,mi).end<daysSinceStart(); }
function isMonthToday(si,mi){ const r=monthRange(si,mi); return daysSinceStart()>=r.start && daysSinceStart()<=r.end; }
function isWeekPast(si,mi,wi){ return dayIndexOf(si,mi,wi,6)<daysSinceStart(); }
function isWeekCurrent(si,mi,wi){ const s=dayIndexOf(si,mi,wi,0); return daysSinceStart()>=s && daysSinceStart()<=s+6; }
function isSeasonPast(si){ return quarterRange(si).end<daysSinceStart(); }
function isSeasonToday(si){ const r=quarterRange(si); return daysSinceStart()>=r.start && daysSinceStart()<=r.end; }
function goalActiveInMonth(g,si,mi){ return monthRange(si,mi).end>=(g.startDayIndex||0); }
function goalActiveInQuarter(g,si){ return quarterRange(si).end>=(g.startDayIndex||0); }
function goalActiveOnDay(g,si,mi,wi,di){ return dayIndexOf(si,mi,wi,di)>=(g.startDayIndex||0); }

const QUARTER_META=[
  {label:'فصل ۱',color:'var(--spring)'},
  {label:'فصل ۲',color:'var(--summer)'},
  {label:'فصل ۳',color:'var(--autumn)'},
  {label:'فصل ۴',color:'var(--winter)'}
];

const QUADRANTS=[
  {key:'q1',label:'فوری و مهم',sub:'همین حالا انجام بده',color:'var(--autumn)'},
  {key:'q2',label:'مهم، غیرفوری',sub:'برنامه‌ریزی کن',color:'var(--spring)'},
  {key:'q3',label:'فوری، غیرمهم',sub:'واگذار کن',color:'var(--summer)'},
  {key:'q4',label:'نه فوری نه مهم',sub:'حذف یا بعداً',color:'var(--winter)'}
];

/* ---------------- State ---------------- */
function defaultState(){
  return { version:2, startDate:{gy:today.getFullYear(),gm:today.getMonth()+1,gd:today.getDate()}, goals:[], dailyExtras:{}, lastCarryDate:null };
}
let state=defaultState();
let view={ mode:'loading', wizardIdx:0, seasonIdx:null, monthIdx:null, weekIdx:null, selectedDayIdx:null, drawerOpen:false, chatBusy:false };
let saveTimer=null;

function uid(){ return 'g'+Math.random().toString(36).slice(2,9); }
function dayKey(dayIndex){ return 'd'+dayIndex; }
function getExtras(dayIndex){ return state.dailyExtras[dayKey(dayIndex)] || []; }
function addExtra(dayIndex,title,quadrant){
  const k=dayKey(dayIndex);
  if(!state.dailyExtras[k]) state.dailyExtras[k]=[];
  state.dailyExtras[k].push({id:uid(),title,quadrant,done:false});
}

/* ---------------- Scoring: only DAY level is checkable; everything above is a derived average ---------------- */
function scoreOf(itemArrays){
  let done=0,total=0;
  itemArrays.forEach(arr=>{ (arr||[]).forEach(it=>{ total++; if(it.done) done++; }); });
  if(total===0) return null;
  return {done,total,pct:Math.round(done/total*100)};
}
function miniBadge(pct,icon){
  const color = pct>=70? 'var(--spring)' : pct>=35? 'var(--summer)' : 'var(--autumn)';
  return `<span class="score-badge" style="--sc:${color}">${icon} ${pct}٪</span>`;
}
function dualBadgeHTML(s){
  let html='';
  if(s.goal!==null) html+=miniBadge(s.goal,'🎯');
  if(s.pers!==null) html+=miniBadge(s.pers,'✎');
  return html;
}
function avgOf(vals){ return vals.length? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : null; }

function dayRawScore(si,mi,wi,di){
  let goalDone=0,goalTotal=0;
  state.goals.forEach(g=>{
    if(!goalActiveOnDay(g,si,mi,wi,di)) return;
    const q=g.quarters[si], m=q && q.months[mi], w=m && m.weeks[wi], day=w && w.days[di];
    if(!day) return;
    day.items.forEach(it=>{ goalTotal++; if(it.done) goalDone++; });
  });
  const dayIdx=dayIndexOf(si,mi,wi,di);
  const extras=getExtras(dayIdx);
  let persDone=0,persTotal=extras.length;
  extras.forEach(ex=>{ if(ex.done) persDone++; });
  return {
    goal: goalTotal>0? Math.round(goalDone/goalTotal*100) : null,
    pers: persTotal>0? Math.round(persDone/persTotal*100) : null
  };
}
function weekScore(si,mi,wi){
  const gVals=[],pVals=[];
  for(let di=0; di<7; di++){
    const r=dayRawScore(si,mi,wi,di);
    if(r.goal!==null) gVals.push(r.goal);
    if(r.pers!==null) pVals.push(r.pers);
  }
  return { goal:avgOf(gVals), pers:avgOf(pVals) };
}
function monthScore(si,mi){
  const weekCount=state.goals.length? (state.goals[0].quarters[si].months[mi].weeks.length||Math.ceil(monthLen(si*3+mi)/7)) : Math.ceil(monthLen(si*3+mi)/7);
  const gVals=[],pVals=[];
  for(let wi=0; wi<weekCount; wi++){
    const s=weekScore(si,mi,wi);
    if(s.goal!==null) gVals.push(s.goal);
    if(s.pers!==null) pVals.push(s.pers);
  }
  return { goal:avgOf(gVals), pers:avgOf(pVals) };
}
function quarterScore(si){
  const gVals=[],pVals=[];
  for(let mi=0; mi<3; mi++){
    const s=monthScore(si,mi);
    if(s.goal!==null) gVals.push(s.goal);
    if(s.pers!==null) pVals.push(s.pers);
  }
  return { goal:avgOf(gVals), pers:avgOf(pVals) };
}
function yearScore(){
  const gVals=[],pVals=[];
  for(let si=0; si<4; si++){
    const s=quarterScore(si);
    if(s.goal!==null) gVals.push(s.goal);
    if(s.pers!==null) pVals.push(s.pers);
  }
  const ms=scoreOf(state.goals.map(g=>g.yearMilestones||[]));
  if(ms) gVals.push(ms.pct);
  return { goal:avgOf(gVals), pers:avgOf(pVals) };
}

function emptyQuarters(){
  return QUARTER_META.map((qm,si)=>({
    label:qm.label, theme:'', items:[], generated:false,
    months:[0,1,2].map(mi=>({
      idx:si*3+mi, label:'ماه '+(si*3+mi+1), items:[], generated:false, weeks:[]
    }))
  }));
}

/* ---------------- Persistence ---------------- */
async function loadState(){
  try{
    const raw=localStorage.getItem('planner-state-v2');
    if(raw){ const parsed=JSON.parse(raw); if(parsed && parsed.version===2){ state=parsed; } }
  }catch(e){ /* ignore */ }
  if(!state.dailyExtras) state.dailyExtras={};
  if(!state.startDate) state.startDate={gy:today.getFullYear(),gm:today.getMonth()+1,gd:today.getDate()};
  runDailyCarryOver();
  view.mode = (state.goals.length===0) ? 'empty' : 'dashboard';
  render();
}
function persist(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{ localStorage.setItem('planner-state-v2', JSON.stringify(state)); }
    catch(e){ console.error('save failed', e); }
  }, 250);
}

function runDailyCarryOver(){
  const todayStr=jToday.jy+'-'+jToday.jm+'-'+jToday.jd;
  if(state.lastCarryDate===todayStr) return;
  const todayIdx=daysSinceStart();
  const prevIdx=todayIdx-1;
  if(prevIdx<0){ state.lastCarryDate=todayStr; return; }
  const todayC=coordsForDayIndex(todayIdx), prevC=coordsForDayIndex(prevIdx);
  if(todayC && prevC){
    state.goals.forEach(g=>{
      const tq=g.quarters[todayC.si], tm=tq && tq.months[todayC.mi], tw=tm && tm.weeks[todayC.wi], tday=tw && tw.days[todayC.di];
      const pq=g.quarters[prevC.si], pm=pq && pq.months[prevC.mi], pw=pm && pm.weeks[prevC.wi], pday=pw && pw.days[prevC.di];
      if(!tday || !pday) return;
      const keep=[],move=[];
      pday.items.forEach(it=>{ if(it.done) keep.push(it); else { it.carried=true; move.push(it); } });
      if(move.length){ pday.items=keep; tday.items=tday.items.concat(move); }
    });
  }
  const prevKey=dayKey(prevIdx), todayKeyStr=dayKey(todayIdx);
  if(state.dailyExtras[prevKey] && state.dailyExtras[prevKey].length){
    const keep=[],move=[];
    state.dailyExtras[prevKey].forEach(ex=>{ if(ex.done) keep.push(ex); else { ex.carried=true; move.push(ex); } });
    if(move.length){
      state.dailyExtras[prevKey]=keep;
      if(!state.dailyExtras[todayKeyStr]) state.dailyExtras[todayKeyStr]=[];
      state.dailyExtras[todayKeyStr]=state.dailyExtras[todayKeyStr].concat(move);
    }
  }
  state.lastCarryDate=todayStr;
  persist();
}

/* ---------------- AI proxy ----------------
   این اپ به یک واسط (Worker) خودت وصل می‌شه که کلید API رو مخفی نگه می‌داره.
   راهنمای ساخت Worker توی فایل «راهنمای-انتشار.md» هست.
*/
const PROXY_URL = "https://charkhesal-proxy.arash-aigpt.workers.dev";

function sanitizeJsonText(str){
  let out='', inString=false, escape=false;
  for(let i=0;i<str.length;i++){
    const ch=str[i];
    if(inString){
      if(escape){ out+=ch; escape=false; continue; }
      if(ch==='\\'){ out+=ch; escape=true; continue; }
      if(ch==='"'){ inString=false; out+=ch; continue; }
      if(ch==='\n'){ out+='\\n'; continue; }
      if(ch==='\r'){ continue; }
      if(ch==='\t'){ out+='\\t'; continue; }
      out+=ch;
    }else{
      if(ch==='"'){ inString=true; out+=ch; continue; }
      out+=ch;
    }
  }
  return out;
}

async function askClaude(system,user){
  const fullSystem = system + "\nخروجی را فقط و فقط یک JSON معتبر بده، بدون ``` و بدون هیچ توضیح قبل یا بعد از آن. هرگز از علامت نقل‌قول انگلیسی (\") داخل مقادیر متنی استفاده نکن؛ اگر لازم بود نقل‌قول بگذاری از « و » استفاده کن. هر مقدار رشته‌ای باید فقط در یک خط باشد و نباید داخلش خط جدید (Enter) باشد. بعد از آخرین عضو هر آرایه یا آبجکت هرگز کاما اضافه نگذار. خیلی مختصر و کوتاه بنویس؛ از هیچ محدودیت طول ذکرشده تجاوز نکن تا پاسخ کامل و ناقطع بماند.";
  let lastErr=null;
  for(let attempt=0; attempt<2; attempt++){
    let res;
    try{
      res=await fetch(PROXY_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ system: fullSystem, user: user })
      });
    }catch(networkErr){ lastErr=new Error('ارتباط با سرور برقرار نشد.'); continue; }
    let data;
    try{ data=await res.json(); }catch(e){ lastErr=new Error('پاسخ سرور قابل خواندن نبود.'); continue; }
    if(data && data.error){ lastErr=new Error(data.error || 'خطای سرور'); continue; }
    const text=(data && data.text) ? data.text : '';
    if(!text){ lastErr=new Error('پاسخ خالی از سرور دریافت شد.'); continue; }
    let clean=text.replace(/```json|```/g,'').trim();
    const s=clean.indexOf('{'), e=clean.lastIndexOf('}');
    if(s===-1||e===-1){ lastErr=new Error('قالب پاسخ نامعتبر بود.'); continue; }
    clean=clean.slice(s,e+1);
    clean=sanitizeJsonText(clean);
    clean=clean.replace(/,(\s*[\]}])/g,'$1');
    try{ return JSON.parse(clean); }
    catch(parseErr){ lastErr=parseErr; continue; }
  }
  throw lastErr || new Error('خطای نامشخص');
}

function changeLogText(goal){
  if(!goal.changeLog || goal.changeLog.length===0) return 'بدون تغییر ثبت‌شده.';
  return goal.changeLog.slice(-4).map(c=>'- '+c.note).join('\n');
}
function chatTranscriptText(goal){
  if(!goal.chat || goal.chat.length===0) return '(بدون مصاحبه)';
  return goal.chat.map(t=>'س: '+t.q+'\nج: '+t.a).join('\n\n');
}

/* ---------------- Deep chat-style interview (up to 30 questions) ---------------- */
async function nextChatQuestion(goal){
  const sys=`شما یک مشاور متخصص هستید که دارید دربارهٔ یک هدف سالانهٔ خاص با کاربر مصاحبه می‌کنید تا بعداً بتوانید یک برنامهٔ دقیق و تخصصی (نه یک فرم سطحی) بسازید. دقیقاً مثل یک متخصص واقعی در همون حوزه رفتار کن:
- برای اهداف مالی/درآمدی/سود: حتماً دقیقاً مشخص کن عدد گفته‌شده «سود خالص» است یا «گردش مالی/درآمد ناخالص»، هزینه‌های ثابت و متغیر، منابع و سرمایهٔ فعلی، مدل کسب‌وکار، بازار هدف.
- برای اهداف تناسب‌اندام/کاهش یا افزایش وزن: وزن و قد فعلی، سابقهٔ پزشکی و محدودیت‌های جسمی، دسترسی به باشگاه یا تجهیزات، ترجیح و محدودیت غذایی، سطح فعالیت فعلی.
- برای اهداف تحصیلی/یادگیری: سطح فعلی، زمان قابل صرف در هفته، منابع در دسترس، سبک یادگیری ترجیحی.
- برای هر حوزهٔ دیگری هم دقیقاً مثل یک مشاور واقعی همون تخصص فکر کن و بپرس.
با توجه به گفتگوی تا این لحظه، فقط یک سوال بعدی (مهم‌ترین سوال باقی‌مانده برای ساخت یک برنامهٔ دقیق) بپرس؛ سوال باید کوتاه و مشخص باشد، نه ترکیبی از چند سوال. اگر بعد از حداقل ۶ سوال، اطلاعات کافی برای یک برنامهٔ دقیق و تخصصی جمع شده، به‌جای سوال جدید، پایان مصاحبه را اعلام کن. هرگز بیشتر از مجموعاً ۳۰ سوال در کل مصاحبه نپرس.
خروجی فقط JSON: {"done":false,"question":"..."} یا {"done":true}`;
  const user=`هدف: «${goal.title}»\nتعداد سوال‌های پرسیده‌شده تا الان: ${(goal.chat||[]).length}\n\nگفتگوی تا این لحظه:\n${chatTranscriptText(goal)}`;
  return await askClaude(sys,user);
}

async function analyzeAndPlan(goal){
  const sys=`شما یک مشاور برنامه‌ریزی واقع‌بین، دقیق و متخصص هستید، نه صرفاً تشویق‌کننده. بر اساس هدف کاربر و کل مصاحبه‌ای که با او انجام شده، واقع‌بینانه بودن هدف را بسنج و یک نقشهٔ راه دقیق و تخصصی بساز که واقعاً منطبق با جزئیاتی باشد که کاربر گفته (مثلاً اگر گفته «سود ۱۰ میلیارد تومان»، این را با «درآمد ناخالص» اشتباه نگیر؛ اگر هدف تناسب‌اندام است و امکانات باشگاه دارد، برنامهٔ باشگاه و تغذیهٔ اختصاصی هم در آیتم‌ها بگنجان). پاسخ باید کوتاه و فشرده باشد. خروجی فقط JSON با این فرمت دقیق:
{
 "status":"realistic|risky|unrealistic",
 "note":"یک یا دو جملهٔ کوتاه و صادقانه فارسی",
 "adjustedGoal":"در صورت غیرواقعی یا پرریسک بودن، جایگزین کوتاه (حداکثر ۱۲ کلمه)؛ وگرنه رشته خالی",
 "yearMilestones":[{"title":"..."}],
 "quarters":[
   {"theme":"کوتاه","items":[{"title":"..."}]},
   {"theme":"کوتاه","items":[{"title":"..."}]},
   {"theme":"کوتاه","items":[{"title":"..."}]},
   {"theme":"کوتاه","items":[{"title":"..."}]}
 ]
}
"quarters" دقیقاً ۴ بازهٔ سه‌ماههٔ متوالیِ برنامه از همین امروز به بعد است (نه فصل‌های واقعی سال، فقط چهار برش زمانی از خودِ برنامه). حداکثر ۳ نقطه عطف سالانه (هرکدام حداکثر ۶ کلمه). برای هر بازه حداکثر ۲ آیتم (هرکدام حداکثر ۸ کلمه، دقیق و تخصصی متناسب با حوزهٔ هدف) و موضوع بازه حداکثر ۴ کلمه.
این برنامه از همین امروز شروع می‌شود، نه از اول یک سال تقویمی.`;
  const user=`هدف: «${goal.title}»\n\nمصاحبهٔ کامل با کاربر:\n${chatTranscriptText(goal)}`;
  const out=await askClaude(sys,user);
  goal.feasibility={status:out.status,note:out.note,adjustedGoal:out.adjustedGoal||''};
  goal.yearMilestones=(out.yearMilestones||[]).map(m=>({title:m.title,done:false}));
  const q=emptyQuarters();
  (out.quarters||[]).forEach((qq,i)=>{ if(q[i]){ q[i].theme=qq.theme||''; q[i].items=(qq.items||[]).map(it=>({title:it.title})); q[i].generated=true; } });
  goal.quarters=q;
  goal.status='planned';
}

async function generateMonthsFor(goal, seasonIdx){
  const quarter=goal.quarters[seasonIdx];
  const sys=`شما یک برنامه‌ریز هستید. با توجه به هدف کاربر و آیتم‌های یک بازهٔ سه‌ماههٔ خاص از برنامه، آن را بین ۳ ماه آن بازه تقسیم کن.
${goal.changeLog && goal.changeLog.length ? 'تغییرات ثبت‌شده توسط کاربر را حتماً در نظر بگیر:\n'+changeLogText(goal):''}
خروجی فقط JSON:
{"months":[{"items":[{"title":"..."}]},{"items":[{"title":"..."}]},{"items":[{"title":"..."}]}]}
حداکثر ۳ آیتم کوتاه (حداکثر ۸ کلمه) برای هر ماه، به ترتیب سه ماه آن بازه.`;
  const user=`هدف: «${goal.title}»\nموضوع بازه: ${quarter.theme}\nآیتم‌های بازه:\n${quarter.items.map(i=>'- '+i.title).join('\n')}`;
  const out=await askClaude(sys,user);
  (out.months||[]).forEach((mm,i)=>{
    if(quarter.months[i]){
      quarter.months[i].items=(mm.items||[]).map(it=>({title:it.title}));
      quarter.months[i].generated=true;
      quarter.months[i].weeks=[];
    }
  });
}

async function generateWeeksFor(goal, seasonIdx, monthIdx){
  const month=goal.quarters[seasonIdx].months[monthIdx];
  const monthAbs=si_mi_to_abs(seasonIdx,monthIdx);
  const len=monthLen(monthAbs);
  const weekCount=Math.ceil(len/7);
  const sys=`شما یک برنامه‌ریز هستید. با توجه به آیتم‌های یک ماه خاص از برنامه، آن را بین ${weekCount} هفتهٔ آن ماه تقسیم کن.
${goal.changeLog && goal.changeLog.length ? 'تغییرات ثبت‌شده توسط کاربر را حتماً در نظر بگیر:\n'+changeLogText(goal):''}
خروجی فقط JSON: {"weeks":[{"items":[{"title":"..."}]}, ...تعداد=${weekCount}]}
حداکثر ۲ آیتم کوتاه (حداکثر ۸ کلمه) برای هر هفته.`;
  const user=`هدف: «${goal.title}»\nآیتم‌های ماه:\n${month.items.map(i=>'- '+i.title).join('\n')}`;
  const out=await askClaude(sys,user);
  month.weeks=(out.weeks||[]).slice(0,weekCount).map((w,i)=>({label:'هفته '+(i+1),items:(w.items||[]).map(it=>({title:it.title})),days:[],daysGenerated:false}));
  while(month.weeks.length<weekCount) month.weeks.push({label:'هفته '+(month.weeks.length+1),items:[],days:[],daysGenerated:false});
  month.weeksGenerated=true;
}
function si_mi_to_abs(si,mi){ return si*3+mi; }

async function generateDaysFor(goal, seasonIdx, monthIdx, weekIdx){
  const week=goal.quarters[seasonIdx].months[monthIdx].weeks[weekIdx];
  const sys=`شما یک برنامه‌ریز هستید. آیتم‌های یک هفتهٔ خاص از برنامه را بین ۷ روز آن هفته تقسیم کن تا یک برنامهٔ روزانهٔ عملی به‌دست بیاید. هر آیتم را طبق ماتریس آیزنهاور دسته‌بندی کن: q1 = فوری و مهم، q2 = مهم ولی غیرفوری، q3 = فوری ولی غیرمهم، q4 = نه فوری نه مهم.
${goal.changeLog && goal.changeLog.length ? 'تغییرات ثبت‌شده توسط کاربر را حتماً در نظر بگیر:\n'+changeLogText(goal):''}
خروجی فقط JSON: {"days":[{"items":[{"title":"...","quadrant":"q1|q2|q3|q4"}]}, ...دقیقاً ۷ مورد]}
حداکثر ۲ آیتم بسیار کوتاه و عملی (حداکثر ۶ کلمه) برای هر روز؛ اگر روزی کاری لازم نیست آرایهٔ آیتم‌هایش خالی باشد.`;
  const user=`هدف: «${goal.title}»\n${week.label} — آیتم‌های هفته:\n${week.items.map(i=>'- '+i.title).join('\n')}`;
  const out=await askClaude(sys,user);
  week.days=(out.days||[]).slice(0,7).map((d)=>({items:(d.items||[]).map(it=>({title:it.title,done:false,quadrant:it.quadrant||'q2'}))}));
  while(week.days.length<7) week.days.push({items:[]});
  week.daysGenerated=true;
}

async function replanScope(goal, level, note){
  goal.changeLog=goal.changeLog||[];
  goal.changeLog.push({note});
  let target, contextTitle;
  if(level.type==='quarter'){ target=goal.quarters[level.si]; contextTitle='آیتم‌های این بازهٔ سه‌ماهه'; }
  if(level.type==='month'){ target=goal.quarters[level.si].months[level.mi]; contextTitle='آیتم‌های این ماه'; }
  if(level.type==='week'){ target=goal.quarters[level.si].months[level.mi].weeks[level.wi]; contextTitle='آیتم‌های '+target.label; }
  const sys=`شما یک برنامه‌ریز هستید که باید بخشی از برنامه را بر اساس یک تغییر جدید به‌روزرسانی کنی. آیتم‌های فعلی و توضیح تغییر داده می‌شود. خروجی فقط JSON: {"items":[{"title":"..."}]} با حداکثر همان تعداد آیتم قبلی یا کمی بیشتر، کوتاه و عملی.`;
  const user=`هدف کلی: «${goal.title}»\n${contextTitle} (وضعیت فعلی):\n${(target.items||[]).map(i=>'- '+i.title).join('\n')}\n\nتغییر جدید گزارش‌شده توسط کاربر: «${note}»`;
  const out=await askClaude(sys,user);
  target.items=(out.items||[]).map(it=>({title:it.title}));
  if(level.type==='quarter'){ goal.quarters[level.si].months.forEach(m=>{m.generated=false;m.weeks=[];}); }
  if(level.type==='month'){ goal.quarters[level.si].months[level.mi].weeks=[]; goal.quarters[level.si].months[level.mi].weeksGenerated=false; }
  if(level.type==='week'){ target.days=[]; target.daysGenerated=false; }
}

    <h3 style="margin-top:16px;">۴. ماتریس آیزنهاور</h3>
    <p class="muted">برنامهٔ هر روز توی ۴ بخش نشون داده می‌شه. روی هر بخش می‌تونی مستقیم تسک شخصی خودت رو هم اضافه کنی.</p>
    <h3 style="margin-top:16px;">۵. نمره‌دهی</h3>
    <p class="muted">هر روز دو نمره داره: 🎯 برای تسک‌های مرتبط با اهداف، ✎ برای تسک‌های شخصی. نمرهٔ هفته/ماه/فصل/سال همیشه خودکار از میانگین روزهای زیرش محاسبه می‌شه.</p>
    <h3 style="margin-top:16px;">۶. تسک‌های انجام‌نشده</h3>
    <p class="muted">هر تسکی که یک روز انجام نشه، خودکار (با علامت ⏪) به روز بعد منتقل می‌شه.</p>

function dashboardHTML(){
  const size=280, cx=size/2, cy=size/2, rOuter=125, rInner=68;
  function arcPath(startDeg,endDeg,r1,r2){
    const toXY=(deg,r)=>{const rad=(deg-90)*Math.PI/180; return [cx+r*Math.cos(rad), cy+r*Math.sin(rad)];};
    const [x1,y1]=toXY(startDeg,r2), [x2,y2]=toXY(endDeg,r2), [x3,y3]=toXY(endDeg,r1), [x4,y4]=toXY(startDeg,r1);
    const large=endDeg-startDeg>180?1:0;
    return `M${x1},${y1} A${r2},${r2} 0 ${large} 1 ${x2},${y2} L${x3},${y3} A${r1},${r1} 0 ${large} 0 ${x4},${y4} Z`;
  }
  let wheel=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  QUARTER_META.forEach((qm,i)=>{
    wheel+=`<path d="${arcPath(i*90,i*90+90,rInner,rOuter)}" fill="${qm.color}" fill-opacity="${i===view.hoverSeason?0.95:0.75}" stroke="var(--bg)" stroke-width="3" data-season="${i}" style="cursor:pointer"/>`;
  });
  wheel+=`<circle cx="${cx}" cy="${cy}" r="${rInner-6}" fill="var(--panel)" stroke="var(--line)"/>`;
  wheel+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" fill="var(--gold)" font-size="18" font-weight="800" font-family="Vazirmatn">روز ${daysSinceStart()+1}</text>`;
  wheel+=`<text x="${cx}" y="${cy+16}" text-anchor="middle" fill="var(--muted)" font-size="11" font-family="Vazirmatn">از ۳۶۵ روز برنامه</text>`;
  wheel+=`</svg>`;

  const seasonCards=QUARTER_META.map((qm,i)=>{
    const badge=dualBadgeHTML(quarterScore(i));
    const past=isSeasonPast(i), curr=isSeasonToday(i);
    const r=quarterRange(i);
    return `<div class="season-card ${past?'is-past':''} ${curr?'is-today':''}" style="--sc:${qm.color}" data-open-season="${i}">
      <div class="bar"></div>
      <div class="name">${qm.label}${curr?'<span class="today-tag">اکنون</span>':''}</div>
      <div class="months">روزهای ${r.start+1} تا ${r.end+1}</div>
      <div style="margin-top:6px;">${badge}</div>
    </div>`;
  }).join('');

  const goalsList=state.goals.map(g=>`
    <div class="goal-chip">
      <span>${g.title}</span>
      <span class="row" style="gap:14px;align-items:center;">
        <span class="hint" style="cursor:pointer;text-decoration:underline;" data-edit-goal="${g.id}">ویرایش</span>
        <span class="x" data-remove-goal="${g.id}" title="حذف هدف">×</span>
      </span>
    </div>`).join('');

  const yearScoreBadge=dualBadgeHTML(yearScore());
  const milestonesHTML=state.goals.filter(g=>g.yearMilestones && g.yearMilestones.length).map(g=>`
    <div class="goal-block">
      <div class="gtitle">${g.title}</div>
      ${g.yearMilestones.map((m,idx)=>`<div class="item-row ${m.done?'done':''}"><input type="checkbox" data-item-toggle data-goal="${g.id}" data-year="1" data-idx="${idx}" ${m.done?'checked':''}><span class="t">◆ ${m.title}</span></div>`).join('')}
    </div>`).join('');

  return `<div class="card">
    <p class="hint" style="text-align:center;margin-bottom:10px;">برنامه از همین امروز شروع می‌شه — ${jToday.jd} ${MONTH_NAMES[jToday.jm-1]} ${jToday.jy}</p>
    <div class="wheel-box">${wheel}</div>
    <div class="row" style="justify-content:center;margin-bottom:6px;">
      <button class="btn primary small" id="btnGoToday">برو به امروز</button>
    </div>
    <div class="season-grid">${seasonCards}</div>
  </div>
  ${milestonesHTML? `<div class="card"><h3>نقاط عطف${yearScoreBadge}</h3>${milestonesHTML}</div>`:''}
  <div class="card">
    <h3>هدف‌های فعال</h3>
    ${goalsList || '<p class="muted">هنوز هدفی ثبت نشده.</p>'}
    <button class="btn ghost small" id="btnAddMoreGoals" style="margin-top:8px;">افزودن هدف جدید</button>
    <button class="btn ghost small" id="btnOpenHelp2" style="margin-top:8px;">راهنمای استفاده از اپ</button>
  </div>`;
}

function crumbs(parts){
  return `<div class="crumbs">` + parts.map((p,i)=>{
    const isLast=i===parts.length-1;
    return (i>0?'<span class="sep">‹</span>':'') + (isLast? `<span>${p.label}</span>` : `<a data-crumb="${p.go}">${p.label}</a>`);
  }).join('') + `</div>`;
}

function quarterHTML(){
  const si=view.seasonIdx;
  const qm=QUARTER_META[si];
  const activeGoals=state.goals.filter(g=>goalActiveInQuarter(g,si));
  const blocks=activeGoals.map(g=>{
    const q=g.quarters[si];
    if(!q.generated){
      return `<div class="goal-block"><div class="gtitle">${g.title}</div><p class="hint">برنامهٔ این بازه هنوز ساخته نشده.</p><button class="btn ghost small" data-regen-goal="${g.id}">ساخت برنامه</button></div>`;
    }
    return `<div class="goal-block" data-goal="${g.id}">
      <div class="gtitle">${g.title}${q.theme? ' — '+q.theme:''}</div>
      ${q.items.map(it=>`<div class="item-row"><span class="t">◆ ${it.title}</span></div>`).join('')}
    </div>`;
  }).join('');

  const months=state.goals.length? [0,1,2].map(mi=>{
    const badge=dualBadgeHTML(monthScore(si,mi));
    const past=isMonthPast(si,mi), curr=isMonthToday(si,mi);
    return `<div class="month-card ${past?'is-past':''} ${curr?'is-today':''}" data-open-month="${mi}">
      <div class="mname">${state.goals[0].quarters[si].months[mi].label}${curr?'<span class="today-tag">اکنون</span>':''}</div>
      <div style="margin-top:4px;">${badge}</div>
      <div class="hint">مشاهده / ساخت برنامهٔ ماه</div>
    </div>`;
  }).join(''):'';

  return `${crumbs([{label:'سال',go:'dashboard'},{label:qm.label}])}
  <div class="card">
    <h2 style="color:${qm.color}">${qm.label}</h2>
    ${blocks || '<p class="muted">هنوز هدفی برای این بازه فعال نیست.</p>'}
    <h3 style="margin-top:20px;">ماه‌ها</h3>
    <div class="month-grid">${months}</div>
    ${updateBoxHTML({type:'quarter',si})}
  </div>`;
}

function monthHTML(){
  const si=view.seasonIdx, mi=view.monthIdx;
  const qm=QUARTER_META[si];
  let needsGen=false;
  const activeGoals=state.goals.filter(g=>goalActiveInMonth(g,si,mi));
  const monthLabel=state.goals.length? state.goals[0].quarters[si].months[mi].label : ('ماه '+(si*3+mi+1));
  const blocks=activeGoals.map(g=>{
    const m=g.quarters[si].months[mi];
    if(m.error){
      return `<div class="goal-block"><div class="gtitle">${g.title}</div><p class="hint">ساخت برنامهٔ ماه با خطا مواجه شد.</p><button class="btn ghost small" data-retry-month="${g.id}">تلاش دوباره</button></div>`;
    }
    if(!m.generated){ needsGen=true; return `<div class="goal-block"><div class="gtitle">${g.title}</div><div class="loading-line"><span class="spinner"></span> در حال ساخت برنامهٔ ماه…</div></div>`; }
    return `<div class="goal-block" data-goal="${g.id}">
      <div class="gtitle">${g.title}</div>
      ${m.items.map(it=>`<div class="item-row"><span class="t">◆ ${it.title}</span></div>`).join('')}
    </div>`;
  }).join('');

  let weeksHTML='';
  const allMonthsReady=state.goals.length>0 && state.goals.every(g=>g.quarters[si].months[mi].generated);
  if(allMonthsReady){
    const anyWeekError=state.goals.some(g=>g.quarters[si].months[mi].weekError);
    const allWeeksReady=state.goals.every(g=>g.quarters[si].months[mi].weeksGenerated);
    if(anyWeekError){
      weeksHTML=`<div class="hint">ساخت هفته‌ها با خطا مواجه شد. <button class="btn ghost small" id="btnRetryWeeks">تلاش دوباره</button></div>`;
    }else if(!allWeeksReady){
      weeksHTML=`<div class="loading-line"><span class="spinner"></span> در حال ساخت هفته‌ها…</div>`;
      triggerWeekGen(si,mi);
    }else{
      const weekCount=state.goals[0].quarters[si].months[mi].weeks.length;
      weeksHTML=`<h3 style="margin-top:20px;">هفته‌ها</h3><div class="week-grid">`+
        Array.from({length:weekCount}).map((_,wi)=>{
          const badge=dualBadgeHTML(weekScore(si,mi,wi));
          const past=isWeekPast(si,mi,wi), curr=isWeekCurrent(si,mi,wi);
          return `<div class="week-card ${past?'is-past':''} ${curr?'is-today':''}" data-open-week="${wi}">هفته ${wi+1}${curr?'<span class="today-tag">اکنون</span>':''}<div style="margin-top:4px;">${badge}</div></div>`;
        }).join('')+`</div>`;
    }
  }
  if(needsGen) triggerMonthGen(si,mi);

  return `${crumbs([{label:'سال',go:'dashboard'},{label:qm.label,go:'quarter'},{label:monthLabel}])}
  <div class="card">
    <h2 style="color:${qm.color}">${monthLabel}</h2>
    ${blocks || '<p class="muted">هنوز هدفی برای این ماه فعال نیست.</p>'}
    ${weeksHTML}
    ${updateBoxHTML({type:'month',si,mi})}
  </div>`;
}

function dayEisenGridHTML(si,mi,wi,di){
  const dayIdx=dayIndexOf(si,mi,wi,di);
  const entries=[];
  state.goals.forEach(g=>{
    if(!goalActiveOnDay(g,si,mi,wi,di)) return;
    const day=g.quarters[si].months[mi].weeks[wi].days[di];
    if(!day) return;
    day.items.forEach((it,idx)=>{
      entries.push({
        title: it.title + (state.goals.length>1? ` — ${g.title}`:''),
        done: it.done, quadrant: it.quadrant||'q2', removable:false, carried: !!it.carried,
        attrs:`data-item-toggle data-goal="${g.id}" data-si="${si}" data-mi="${mi}" data-wi="${wi}" data-di="${di}" data-idx="${idx}"`
      });
    });
  });
  getExtras(dayIdx).forEach(ex=>{
    entries.push({
      title: ex.title, done: ex.done, quadrant: ex.quadrant||'q2', removable:true, extraId: ex.id, carried: !!ex.carried,
      attrs:`data-item-toggle data-extra="${ex.id}" data-dayidx="${dayIdx}"`
    });
  });
  const badge=dualBadgeHTML(dayRawScore(si,mi,wi,di));
  const past=isDayPast(si,mi,wi,di), curr=isDayToday(si,mi,wi,di);
  const j=jalaliForDayIndex(dayIdx);
  const grid=QUADRANTS.map(q=>{
    const rows=entries.filter(e=>e.quadrant===q.key).map(e=>`
      <div class="item-row ${e.done?'done':''}">
        <input type="checkbox" ${e.attrs} ${e.done?'checked':''}>
        <span class="t">${e.carried?'<span class="hint">⏪ </span>':''}${e.title}</span>
        ${e.removable? `<span class="del-x" data-remove-extra="${e.extraId}" data-dayidx="${dayIdx}">×</span>`:''}
      </div>`).join('');
    return `<div class="eisen-cell" style="--qc:${q.color}">
      <div class="qh">${q.label}</div>
      <div class="qs">${q.sub}</div>
      ${rows || '<p class="hint">کاری نیست.</p>'}
      <input type="text" class="quick-add" placeholder="+ افزودن کار…" data-quick-add data-dayidx="${dayIdx}" data-quad="${q.key}">
    </div>`;
  }).join('');
  return `<div class="goal-block ${past?'is-past':''} ${curr?'is-today':''}">
    <div class="gtitle">${weekdayNameForDayIndex(dayIdx)} ${j.jd} ${MONTH_NAMES[j.jm-1]}${curr?'<span class="today-tag">امروز</span>':''}<div style="margin-top:4px;display:inline-block;">${badge}</div></div>
    <div class="eisen-grid">${grid}</div>
  </div>`;
}

function weekHTML(){
  const si=view.seasonIdx, mi=view.monthIdx, wi=view.weekIdx;
  const qm=QUARTER_META[si];

  const monthsReady=state.goals.length>0 && state.goals.every(g=>g.quarters[si].months[mi] && g.quarters[si].months[mi].generated);
  if(!monthsReady){
    triggerMonthGen(si,mi);
    return `${crumbs([{label:'سال',go:'dashboard'},{label:qm.label,go:'quarter'}])}
    <div class="card loading-line"><span class="spinner"></span> در حال آماده‌سازی برنامهٔ ماه…</div>`;
  }

  const monthLabel=state.goals[0].quarters[si].months[mi].label;
  const activeGoals=state.goals.filter(g=>goalActiveInMonth(g,si,mi));
  const blocks=activeGoals.map(g=>{
    const w=g.quarters[si].months[mi].weeks[wi];
    if(!w) return '';
    return `<div class="goal-block" data-goal="${g.id}">
      <div class="gtitle">${g.title}</div>
      ${w.items.length? w.items.map(it=>`<div class="item-row"><span class="t">◆ ${it.title}</span></div>`).join('') : '<p class="hint">برای این هفته آیتم خاصی ثبت نشده.</p>'}
    </div>`;
  }).join('');

  let daysHTML='';
  const weeksExist=state.goals.every(g=>g.quarters[si].months[mi].weeks[wi]);
  if(!weeksExist){
    triggerWeekGen(si,mi);
    daysHTML=`<div class="loading-line"><span class="spinner"></span> در حال آماده‌سازی هفته…</div>`;
  }else{
    const anyErr=state.goals.some(g=>g.quarters[si].months[mi].weeks[wi].dayError);
    const allReady=state.goals.every(g=>g.quarters[si].months[mi].weeks[wi].daysGenerated);
    if(anyErr){
      daysHTML=`<div class="hint">ساخت برنامهٔ روزانه با خطا مواجه شد. <button class="btn ghost small" id="btnRetryDays">تلاش دوباره</button></div>`;
    }else if(!allReady){
      daysHTML=`<div class="loading-line"><span class="spinner"></span> در حال ساخت برنامهٔ روزانه…</div>`;
      triggerDayGen(si,mi,wi);
    }else{
      if(view.selectedDayIdx===null || view.selectedDayIdx===undefined){
        view.selectedDayIdx = isWeekCurrent(si,mi,wi) ? Math.min(6,Math.max(0,daysSinceStart()-dayIndexOf(si,mi,wi,0))) : 0;
      }
      const tabs=[0,1,2,3,4,5,6].map(di=>{
        const past=isDayPast(si,mi,wi,di), curr=isDayToday(si,mi,wi,di);
        const dIdx=dayIndexOf(si,mi,wi,di);
        return `<div class="day-tab ${di===view.selectedDayIdx?'active':''} ${past?'is-past':''}" data-select-day="${di}">${weekdayNameForDayIndex(dIdx)}${curr?' ●':''}</div>`;
      }).join('');
      daysHTML=`<div class="day-tabs">${tabs}</div>` + dayEisenGridHTML(si,mi,wi,view.selectedDayIdx);
    }
  }

  return `${crumbs([{label:'سال',go:'dashboard'},{label:qm.label,go:'quarter'},{label:monthLabel,go:'month'},{label:'هفته '+(wi+1)}])}
  <div class="card">
    <h2 style="color:${qm.color}">${monthLabel} — هفته ${wi+1}</h2>
    ${blocks || '<p class="muted">هنوز هدفی برای این هفته فعال نیست.</p>'}
    <h3 style="margin-top:20px;">برنامهٔ روزانه</h3>
    ${daysHTML}
    ${updateBoxHTML({type:'week',si,mi,wi})}
  </div>`;
}

function updateBoxHTML(level){
  return `<div class="update-box">
    <h3>اگه برنامه تغییر کرد بگو تا خودم به‌روزش کنم</h3>
    <textarea id="updateNote" placeholder="مثلاً: این هفته به‌خاطر بیماری نتونستم ورزش کنم / زودتر از موعد به هدف رسیدم…"></textarea>
    <button class="btn primary small" id="btnUpdate" style="margin-top:8px;" data-level='${JSON.stringify(level)}'>به‌روزرسانی برنامه</button>
  </div>`;
}

/* ---------------- Lazy generation triggers ---------------- */
let genLock={};
function triggerMonthGen(si,mi){
  const key='m'+si+'_'+mi;
  if(genLock[key]) return;
  genLock[key]=true;
  (async ()=>{
    for(const g of state.goals){
      const m=g.quarters[si].months[mi];
      if(!m.generated && !m.error){
        try{ await generateMonthsFor(g,si); }
        catch(e){ console.error(e); m.error=true; }
      }
    }
    persist(); render();
    genLock[key]=false;
  })();
}
function triggerWeekGen(si,mi){
  const key='w'+si+'_'+mi;
  if(genLock[key]) return;
  genLock[key]=true;
  (async ()=>{
    for(const g of state.goals){
      const m=g.quarters[si].months[mi];
      if(!m.weeksGenerated && !m.weekError){
        try{ await generateWeeksFor(g,si,mi); }
        catch(e){ console.error(e); m.weekError=true; }
      }
    }
    persist(); render();
    genLock[key]=false;
  })();
}
function triggerDayGen(si,mi,wi){
  const key='d'+si+'_'+mi+'_'+wi;
  if(genLock[key]) return;
  genLock[key]=true;
  (async ()=>{
    for(const g of state.goals){
      const w=g.quarters[si].months[mi].weeks[wi];
      if(w && !w.daysGenerated && !w.dayError){
        try{ await generateDaysFor(g,si,mi,wi); }
        catch(e){ console.error(e); w.dayError=true; }
      }
    }
    persist(); render();
    genLock[key]=false;
  })();
}

/* ---------------- Events ---------------- */
function bindEvents(){
  const $=id=>document.getElementById(id);

  if($('btnStart')){ $('btnStart').onclick=()=>{ draftGoals=[]; view.mode='wizard-goals'; render(); }; }
  if($('goalInput')){ $('goalInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addDraftGoal(); } }); }
  if($('btnAddGoal')){ $('btnAddGoal').onclick=addDraftGoal; }
  document.querySelectorAll('[data-i]').forEach(el=>{ el.onclick=()=>{ draftGoals.splice(+el.dataset.i,1); render(); }; });
  if($('btnNext')){
    $('btnNext').onclick=async ()=>{
      const startIdx=state.goals.length;
      draftGoals.forEach(t=>state.goals.push({
        id:uid(), title:t, status:'draft', chat:[], pendingQuestion:null,
        feasibility:null, yearMilestones:[], quarters: emptyQuarters(), changeLog:[],
        startDayIndex: daysSinceStart()
      }));
      draftGoals=[];
      view.wizardIdx=startIdx;
      await startChat(state.goals[view.wizardIdx]);
    };
  }

  if($('btnSendChatAnswer')){
    $('btnSendChatAnswer').onclick=()=>{
      const v=document.getElementById('chatAnswerInput').value.trim();
      if(!v) return;
      submitChatAnswer(state.goals[view.wizardIdx], v);
    };
  }
  if(document.getElementById('chatAnswerInput')){
    document.getElementById('chatAnswerInput').addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); if($('btnSendChatAnswer')) $('btnSendChatAnswer').click(); }
    });
  }
  if($('btnFinishChatEarly')){ $('btnFinishChatEarly').onclick=()=>{ finishChatAndPlan(state.goals[view.wizardIdx]); }; }
  if($('btnRetryQuestions')){ $('btnRetryQuestions').onclick=()=>{ startChat(state.goals[view.wizardIdx]); }; }
  if($('btnRetryAnalyze')){ $('btnRetryAnalyze').onclick=()=>{ finishChatAndPlan(state.goals[view.wizardIdx]); }; }

  if($('btnAcceptPlan')){
    $('btnAcceptPlan').onclick=async ()=>{
      view.wizardIdx++;
      if(view.wizardIdx<state.goals.length && state.goals[view.wizardIdx].status==='draft'){
        await startChat(state.goals[view.wizardIdx]);
      } else {
        view.mode='dashboard'; persist(); render();
      }
    };
  }

  if($('btnAddMoreGoals')){ $('btnAddMoreGoals').onclick=()=>{ draftGoals=[]; view.mode='wizard-goals'; render(); }; }
  if($('btnGoToday')){
    $('btnGoToday').onclick=()=>{
      const c=coordsForDayIndex(daysSinceStart());
      if(c){ view.seasonIdx=c.si; view.monthIdx=c.mi; view.mode='month'; }
      render();
    };
  }
  if($('btnOpenHelp2')){ $('btnOpenHelp2').onclick=()=>{ view.mode='help'; render(); }; }

  document.querySelectorAll('[data-remove-goal]').forEach(el=>{
    el.onclick=()=>{
      if(el.dataset.confirming==='1'){
        state.goals=state.goals.filter(g=>g.id!==el.dataset.removeGoal);
        persist();
        if(state.goals.length===0) view.mode='empty';
        render();
      }else{
        document.querySelectorAll('[data-remove-goal]').forEach(o=>{o.dataset.confirming='0';o.textContent='×';o.style.color='';});
        el.dataset.confirming='1'; el.textContent='مطمئنی؟ ×'; el.style.color='var(--autumn)';
        setTimeout(()=>{ if(el.isConnected && el.dataset.confirming==='1'){ el.dataset.confirming='0'; el.textContent='×'; el.style.color=''; } },3000);
      }
    };
  });
  document.querySelectorAll('[data-edit-goal]').forEach(el=>{
    el.onclick=()=>{
      const idx=state.goals.findIndex(g=>g.id===el.dataset.editGoal);
      if(idx===-1) return;
      view.wizardIdx=idx; view.mode='wizard-edit-title'; render();
    };
  });
  if($('btnEditContinue')){
    $('btnEditContinue').onclick=()=>{
      const v=document.getElementById('editTitleInput').value.trim();
      const goal=state.goals[view.wizardIdx];
      if(v) goal.title=v;
      goal.chat=[]; goal.pendingQuestion=null; goal.status='draft';
      goal.startDayIndex=daysSinceStart();
      persist();
      startChat(goal);
    };
  }
  if($('btnEditCancel')){ $('btnEditCancel').onclick=()=>{ view.mode='dashboard'; render(); }; }

  document.querySelectorAll('[data-season]').forEach(el=>{ el.onmouseenter=()=>{ view.hoverSeason=+el.dataset.season; render(); }; });
  document.querySelectorAll('[data-open-season]').forEach(el=>{ el.onclick=()=>{ view.seasonIdx=+el.dataset.openSeason; view.mode='quarter'; render(); }; });
  document.querySelectorAll('[data-open-month]').forEach(el=>{ el.onclick=()=>{ view.monthIdx=+el.dataset.openMonth; view.mode='month'; render(); }; });
  document.querySelectorAll('[data-open-week]').forEach(el=>{ el.onclick=()=>{ view.weekIdx=+el.dataset.openWeek; view.selectedDayIdx=null; view.mode='week'; render(); }; });
  document.querySelectorAll('[data-select-day]').forEach(el=>{ el.onclick=()=>{ view.selectedDayIdx=+el.dataset.selectDay; render(); }; });
  document.querySelectorAll('[data-crumb]').forEach(el=>{ el.onclick=()=>{ view.mode=el.dataset.crumb; render(); }; });

  document.querySelectorAll('[data-regen-goal]').forEach(el=>{
    el.onclick=async ()=>{
      const g=state.goals.find(x=>x.id===el.dataset.regenGoal);
      el.disabled=true; el.textContent='در حال ساخت…';
      try{ await analyzeAndPlan(g); persist(); }catch(e){ console.error(e); showToast('ساخت برنامه با خطا مواجه شد.'); }
      render();
    };
  });
  document.querySelectorAll('[data-retry-month]').forEach(el=>{
    el.onclick=()=>{
      const g=state.goals.find(x=>x.id===el.dataset.retryMonth);
      g.quarters[view.seasonIdx].months[view.monthIdx].error=false;
      render();
    };
  });
  if($('btnRetryWeeks')){ $('btnRetryWeeks').onclick=()=>{ state.goals.forEach(g=>{ g.quarters[view.seasonIdx].months[view.monthIdx].weekError=false; }); render(); }; }
  if($('btnRetryDays')){ $('btnRetryDays').onclick=()=>{ state.goals.forEach(g=>{ g.quarters[view.seasonIdx].months[view.monthIdx].weeks[view.weekIdx].dayError=false; }); render(); }; }

  document.querySelectorAll('[data-item-toggle]').forEach(el=>{
    el.onchange=()=>{
      if(el.dataset.extra!==undefined && el.dataset.extra!==''){
        const list=getExtras(+el.dataset.dayidx);
        const ex=list.find(x=>x.id===el.dataset.extra);
        if(ex) ex.done=el.checked;
        persist(); render();
        return;
      }
      const si=el.dataset.si, mi=el.dataset.mi, wi=el.dataset.wi, di=el.dataset.di, idx=+el.dataset.idx;
      const g=state.goals.find(x=>x.id===el.dataset.goal);
      let arr;
      if(el.dataset.year!==undefined && el.dataset.year!=='') arr=g.yearMilestones;
      else arr=g.quarters[si].months[mi].weeks[wi].days[di].items;
      arr[idx].done=el.checked;
      persist(); render();
    };
  });

  document.querySelectorAll('[data-quick-add]').forEach(el=>{
    el.onkeydown=(e)=>{
      if(e.key!=='Enter') return;
      const title=el.value.trim();
      if(!title) return;
      addExtra(+el.dataset.dayidx, title, el.dataset.quad);
      persist(); render();
    };
  });
  document.querySelectorAll('[data-remove-extra]').forEach(el=>{
    el.onclick=()=>{
      const k=dayKey(+el.dataset.dayidx);
      state.dailyExtras[k]=(state.dailyExtras[k]||[]).filter(x=>x.id!==el.dataset.removeExtra);
      persist(); render();
    };
  });

  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick=()=>{
      const k=el.dataset.nav;
      const c=coordsForDayIndex(daysSinceStart());
      if(!c){ return; }
      if(k==='dashboard'){ view.mode='dashboard'; }
      else if(k==='quarter-today'){ view.seasonIdx=c.si; view.mode='quarter'; }
      else if(k==='month-today'){ view.seasonIdx=c.si; view.monthIdx=c.mi; view.mode='month'; }
      else if(k==='week-today' || k==='day-today'){
        view.seasonIdx=c.si; view.monthIdx=c.mi; view.weekIdx=c.wi;
        view.selectedDayIdx = k==='day-today' ? c.di : null;
        view.mode='week';
      }
      render();
    };
  });

  if($('btnMenu')){ $('btnMenu').onclick=()=>{ view.drawerOpen=true; render(); }; }
  if($('btnCloseDrawer')){ $('btnCloseDrawer').onclick=()=>{ view.drawerOpen=false; render(); }; }
  if($('drawerOverlay')){ $('drawerOverlay').onclick=()=>{ view.drawerOpen=false; render(); }; }
  if($('btnOpenHelp')){ $('btnOpenHelp').onclick=()=>{ view.drawerOpen=false; view.mode='help'; render(); }; }
  if($('btnUpgrade')){ $('btnUpgrade').onclick=()=>{ view.drawerOpen=false; render(); showToast('نسخهٔ پرمیوم به‌زودی اضافه می‌شه ✨'); }; }
  if($('btnDrawerLogin')){ $('btnDrawerLogin').onclick=()=>{ view.drawerOpen=false; render(); showToast('ورود/ثبت‌نام در فاز بعدی اضافه می‌شه'); }; }

  if($('btnUpdate')){
    $('btnUpdate').onclick=async ()=>{
      const note=$('updateNote').value.trim();
      if(!note) return;
      const level=JSON.parse($('btnUpdate').dataset.level);
      $('btnUpdate').disabled=true; $('btnUpdate').textContent='در حال به‌روزرسانی…';
      for(const g of state.goals){ await replanScope(g, level, note).catch(()=>{}); }
      persist();
      showToast('برنامه به‌روزرسانی شد ✦');
      render();
    };
  }
}

function addDraftGoal(){
  const el=document.getElementById('goalInput');
  const v=el.value.trim();
  if(v){ draftGoals.push(v); el.value=''; render(); document.getElementById('goalInput').focus(); }
}

async function startChat(goal){
  goal.chat=goal.chat||[];
  view.mode='wizard-chat'; view.chatBusy=true; render();
  try{
    const out=await nextChatQuestion(goal);
    if(out.done || goal.chat.length>=30){ await finishChatAndPlan(goal); return; }
    goal.pendingQuestion=out.question;
    view.chatBusy=false;
  }catch(e){
    console.error(e);
    view.mode='wizard-questions-error';
  }
  render();
}
async function submitChatAnswer(goal, answer){
  goal.chat.push({q:goal.pendingQuestion, a:answer});
  goal.pendingQuestion=null;
  persist();
  view.chatBusy=true; render();
  if(goal.chat.length>=30){ await finishChatAndPlan(goal); return; }
  try{
    const out=await nextChatQuestion(goal);
    if(out.done){ await finishChatAndPlan(goal); return; }
    goal.pendingQuestion=out.question;
    view.chatBusy=false;
  }catch(e){
    console.error(e);
    view.mode='wizard-questions-error';
  }
  render();
}
async function finishChatAndPlan(goal){
  view.mode='wizard-analyzing'; render();
  try{
    await analyzeAndPlan(goal);
    persist();
    view.mode='wizard-feasibility';
  }catch(e){
    console.error(e);
    view.mode='wizard-analyze-error';
  }
  render();
}

function showToast(msg){
  const t=document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2600);
}

loadState();
</script>
